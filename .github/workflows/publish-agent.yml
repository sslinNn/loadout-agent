name: Publish loadout-agent
on:
  push:
    tags: ["loadout-agent-v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # npm@latest refuses git deps (EALLOWGIT). @loadout/shared is a GitHub pin, build-time only.
      - run: npm ci --allow-git all --allow-remote all
      - run: npm run build
      - run: npm publish -w loadout-agent
