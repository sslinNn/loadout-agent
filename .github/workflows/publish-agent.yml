name: Publish loadout-agen
on:
  push:
    tags: ["loadout-agen-v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: setup-node would inject a dummy NODE_AUTH_TOKEN and
      # npm would skip OIDC trusted publishing (404 / ENEEDAUTH).
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install -g npm@latest
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # npm@latest refuses git deps (EALLOWGIT). @loadout/shared is a GitHub pin, build-time only.
      - run: npm ci --allow-git all --allow-remote all
      - run: npm run build
      - run: bash scripts/assert-publishable.sh
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
            chmod 600 "$HOME/.npmrc"
          fi
          npm publish -w loadout-agen --access public
