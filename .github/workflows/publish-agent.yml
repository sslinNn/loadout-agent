name: Publish loadout-agent
on:
  push:
    tags: ["loadout-agent-v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # npm@latest refuses git deps (EALLOWGIT). @loadout/shared is a GitHub pin, build-time only.
      - run: npm ci --allow-git all --allow-remote all
      - run: npm run build
      # setup-node with registry-url writes a dummy NODE_AUTH_TOKEN. That empty
      # classic auth blocks OIDC trusted publishing and npm reports it as 404.
      - run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN
          npm publish -w loadout-agent --access public
        env:
          NODE_AUTH_TOKEN: ""
